<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Nayab Usama — Full-Stack Software Engineer</title>
  <desc id="desc">Next-Gen Cyber Glassmorphic Hero Banner for Nayab Usama's GitHub Profile</desc>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="45%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
    
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes scanLine {
      0% { transform: translateX(-600px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .pulse-anim { animation: pulseOrb 6s ease-in-out infinite; }
    .spin-clock { transform-origin: 980px 190px; animation: spinSlow 28s linear infinite; }
    .spin-counter { transform-origin: 980px 190px; animation: spinReverse 20s linear infinite; }
    .laser-scan { animation: scanLine 7s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .blink-dot { animation: blink 2s ease-in-out infinite; }
  </style>

  <!-- Card Canvas Background -->
  <rect width="1200" height="380" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="24" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="980" cy="180" r="220" fill="url(#glowCyan)" filter="url(#softBlur)" class="pulse-anim"/>
  <circle cx="200" cy="300" r="160" fill="url(#glowPurple)" filter="url(#softBlur)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6">
    <line x1="820" y1="0" x2="820" y2="380"/>
    <line x1="880" y1="0" x2="880" y2="380"/>
    <line x1="940" y1="0" x2="940" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
    <line x1="1060" y1="0" x2="1060" y2="380"/>
    <line x1="1120" y1="0" x2="1120" y2="380"/>

    <line x1="780" y1="70" x2="1200" y2="70"/>
    <line x1="780" y1="130" x2="1200" y2="130"/>
    <line x1="780" y1="190" x2="1200" y2="190"/>
    <line x1="780" y1="250" x2="1200" y2="250"/>
    <line x1="780" y1="310" x2="1200" y2="310"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(64, 66)">

    <!-- Name & Title -->
    <g transform="translate(0, 42)">
      <text x="0" y="0" fill="#f8fafc" class="font-sans" font-size="58" font-weight="900" letter-spacing="-1.5">
        NAYAB USAMA
      </text>
      <text x="2" y="38" fill="url(#accentCyan)" class="font-sans" font-size="22" font-weight="700" letter-spacing="0.5">
        FULL-STACK SOFTWARE ENGINEER &amp; PRODUCT BUILDER
      </text>
    </g>

    <!-- Mission & Bio -->
    <text x="2" y="122" fill="#94a3b8" class="font-sans" font-size="16" font-weight="400">
      Software Engineering Graduate (NUML '26) · Multan, PK
    </text>
    <text x="2" y="148" fill="#cbd5e1" class="font-sans" font-size="15" font-weight="500">
      React · TypeScript · Node.js · Django REST · PostgreSQL · Applied AI &amp; LLMs
    </text>

    <!-- Interactive Terminal Code Pill -->
    <g transform="translate(0, 182)">
      <rect width="580" height="48" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
      
      <!-- Window Controls -->
      <circle cx="20" cy="24" r="5" fill="#ef4444" opacity="0.85"/>
      <circle cx="36" cy="24" r="5" fill="#f59e0b" opacity="0.85"/>
      <circle cx="52" cy="24" r="5" fill="#10b981" opacity="0.85"/>

      <!-- Code Text with Highlighting -->
      <text x="76" y="29" class="font-mono" font-size="13">
        <tspan fill="#ec4899">const</tspan>
        <tspan fill="#38bdf8"> dev</tspan>
        <tspan fill="#94a3b8"> = { </tspan>
        <tspan fill="#f59e0b">mission</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#34d399">"Ship Resilient Code"</tspan><tspan fill="#94a3b8">, </tspan>
        <tspan fill="#f59e0b">bugsLeft</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#f43f5e">0</tspan><tspan fill="#94a3b8">, </tspan>
        <tspan fill="#f59e0b">☕</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#38bdf8">∞</tspan>
        <tspan fill="#94a3b8"> };</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side: Cyber Tech Geometric Radar / Orbitals -->
  <g id="radar-system">
    <!-- Outer Orbital Ring -->
    <circle cx="980" cy="190" r="120" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6"/>
    
    <!-- Rotating Cyan Segmented Ring -->
    <circle cx="980" cy="190" r="96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="160 80 50 120" class="spin-clock" opacity="0.85" filter="url(#glowFilter)"/>

    <!-- Counter-rotating Purple Ring -->
    <circle cx="980" cy="190" r="68" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="100 60 40 80" class="spin-counter" opacity="0.75"/>

    <!-- Core Glowing Sphere -->
    <circle cx="980" cy="190" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="980" cy="190" r="18" fill="url(#accentCyan)" filter="url(#glowFilter)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="190" r="6" fill="#ffffff"/>

    <!-- Orbital Satellite Nodes / Floating Tech Chips -->
    <g transform="translate(980, 190)">
      <!-- React Node (Top Right) -->
      <g transform="translate(86, -86)">
        <rect x="-24" y="-14" width="48" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="0" y="5" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" text-anchor="middle">React</text>
      </g>

      <!-- TypeScript Node (Bottom Right) -->
      <g transform="translate(96, 70)">
        <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="0" y="5" fill="#60a5fa" class="font-mono" font-size="11" font-weight="700" text-anchor="middle">TS</text>
      </g>

      <!-- Python / Django Node (Top Left) -->
      <g transform="translate(-105, -60)">
        <rect x="-28" y="-14" width="56" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
        <text x="0" y="5" fill="#34d399" class="font-mono" font-size="11" font-weight="700" text-anchor="middle">Django</text>
      </g>

      <!-- AI Node (Bottom Left) -->
      <g transform="translate(-85, 85)">
        <rect x="-26" y="-14" width="52" height="28" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
        <text x="0" y="5" fill="#d8b4fe" class="font-mono" font-size="11" font-weight="700" text-anchor="middle">AI/ML</text>
      </g>
    </g>
  </g>

  <!-- Bottom Laser Scanning Line Animation -->
  <g transform="translate(0, 376)">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#1e293b" stroke-width="2"/>
    <rect width="400" height="3" fill="url(#laserBeam)" class="laser-scan"/>
  </g>
</svg>
