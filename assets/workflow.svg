<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title">
  <title id="title">Nayab Usama engineering workflow</title>
  <defs>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" rx="24" fill="#0d1117" stroke="#30363d"/>
  <path d="M140 90 H1060" stroke="#30363d" stroke-width="4"/>
  <path d="M140 90 H1060" stroke="url(#flow)" stroke-width="4" stroke-dasharray="120 800">
    <animate attributeName="stroke-dashoffset" values="0;-920" dur="5.5s" repeatCount="indefinite"/>
  </path>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(150 90)">
      <circle r="28" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text y="6" fill="#f0f6fc" font-size="18" font-weight="700">01</text>
      <text y="58" fill="#c9d1d9" font-size="15">Understand</text>
    </g>
    <g transform="translate(375 90)">
      <circle r="28" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text y="6" fill="#f0f6fc" font-size="18" font-weight="700">02</text>
      <text y="58" fill="#c9d1d9" font-size="15">Model</text>
    </g>
    <g transform="translate(600 90)">
      <circle r="28" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text y="6" fill="#f0f6fc" font-size="18" font-weight="700">03</text>
      <text y="58" fill="#c9d1d9" font-size="15">Build</text>
    </g>
    <g transform="translate(825 90)">
      <circle r="28" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text y="6" fill="#f0f6fc" font-size="18" font-weight="700">04</text>
      <text y="58" fill="#c9d1d9" font-size="15">Verify</text>
    </g>
    <g transform="translate(1050 90)">
      <circle r="28" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text y="6" fill="#f0f6fc" font-size="18" font-weight="700">05</text>
      <text y="58" fill="#c9d1d9" font-size="15">Ship</text>
    </g>
  </g>
</svg>
